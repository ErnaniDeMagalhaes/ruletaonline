<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruleta Albiceleste - iGaming Portfolio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>CORONADOS DE GLORIA</h1>

    <div class="casino-table-container">
        <div class="casino-table">
            <!-- Rueda a la izquierda -->
            <div class="wheel-container">
                <div class="roulette-wheel" id="rueda">
                    <div class="wheel-center">⭐⭐⭐</div>
                </div>
            </div>

            <!-- Tablero de apuestas completo a la derecha -->
            <div class="board-container">
                <div class="board-grid" id="tablero">
                    <!-- El 0 y celdas numéricas se inyectan por JS -->
                </div>
            </div>
        </div>

        <!-- PANEL DE CONTROL INFERIOR -->
        <div class="control-panel">
            <!-- Izquierda: Usuario -->
            <div class="user-profile">
                <div class="avatar-container">
                    <img src="https://images.pexels.com/photos/37134547/pexels-photo-37134547.jpeg?_gl=1*hn8400*_ga*MTMwMTQ0NzMzNC4xNzgyMzY5MTQz*_ga_8JE65Q40S6*czE3ODYyNTQzNDAkbzIkZzEkdDE3ODYyNTQzNTMkajQ3JGwwJGgw" alt="Avatar" class="user-avatar">
                </div>
                <div class="user-info">
                    <span class="user-name">Scaloneta</span>
                    <span class="user-balance">$1,000.00</span>
                </div>
            </div>

            <!-- Centro-Izquierda: Selector de Fichas -->
            <div class="chips-selector">
                <div class="chip" data-value="1">$1</div>
                <div class="chip selected" data-value="5">$5</div>
                <div class="chip" data-value="10">$10</div>
                <div class="chip" data-value="25">$25</div>
                <div class="chip" data-value="50">$50</div>
            </div>

            <!-- Derecha: Botones de Acción -->
            <div class="action-buttons">
                <button class="btn-control" id="btnLimpiar">Limpiar</button>
                <button class="btn-control primary" id="btnGirar">Girar Rueda</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
